# Workspace OS drift-classification policy (R7 + R14 PRESERVE rule).
# Canonical green baseline: 17 PASS / 0 FAIL.
# Historical mission directories may emit 'sprint_pattern_incomplete'. That
# marker is informational for the pre-v2 mission corpus; new missions are still
# created with all 8 files and the structural validator requires source-task.md
# plus progress.md. Security and audit-integrity drift remains unwaivable.
schema_version: 1
invariants:
  min_pass_count: 17
  max_fail_count: 0
  max_runtime_seconds: 60
known_drift:
  - sprint_pattern_incomplete
forbidden_drift:
  - unexpected_db_writer
  - missing_validator_script
mandatory_drift:  # R14 PRESERVE: never waivable, even with --accept-drift
  - missing_security_audit_log
  - missing_audit_json_key
baseline:
  pass_count: 17
  fail_count: 0
