[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-os"
version = "2.0.0a1"
description = "Workspace OS v2 local Python validator + CLI + SQLite state store"
requires-python = ">=3.11"
authors = [
  {name = "Taras Polishchuk"},
]
license = {text = "MIT"}
readme = "README.md"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7.0"]
dev = ["pytest>=7.0", "ruff>=0.6.0", "mypy>=1.5", "bandit>=1.7", "pip-audit>=2.6"]

[project.scripts]
workspace-os = "workspace_os.cli:main"
validator = "workspace_os.validator.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
